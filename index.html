<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquid Glass Keyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1c3d;--bg2:#143262;--b1:rgba(64,190,240,.7);--b2:rgba(112,108,240,.62);--b3:rgba(40,214,204,.5);--b4:rgba(176,226,255,.5)}
[data-theme=dusk]{--bg1:#16183f;--bg2:#2b2468;--b1:rgba(120,130,255,.7);--b2:rgba(180,110,240,.55);--b3:rgba(70,170,240,.5);--b4:rgba(210,200,255,.45)}
[data-theme=mint]{--bg1:#0a2a33;--bg2:#10475a;--b1:rgba(60,220,200,.65);--b2:rgba(70,150,240,.6);--b3:rgba(120,230,170,.45);--b4:rgba(190,240,255,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#070d1c;color:#fff;font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.screen{position:relative;overflow:hidden;width:min(100vw,420px);height:min(100dvh,844px);background:linear-gradient(170deg,var(--bg1),var(--bg2))}
@media(min-width:460px){.screen{border-radius:46px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}}
.blob{position:absolute;border-radius:50%;filter:blur(48px);transition:background .6s}
.tag{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.78)}
.doc{position:absolute;left:0;right:0;top:56px;bottom:316px;padding:8px 24px;overflow:auto;font-size:26px;line-height:1.35;font-weight:500;white-space:pre-wrap;word-break:break-word;outline:none}
.ph{color:rgba(255,255,255,.7)}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.15em;border-radius:1px;background:#8fd8ff;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{position:absolute;left:8px;right:8px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 10px 12px;border-radius:38px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 42%,rgba(255,255,255,.14)),rgba(14,32,72,.4);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 34px 60px -14px rgba(2,10,30,.6),0 8px 20px rgba(2,10,30,.32),inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.2),inset 10px 0 22px -12px rgba(120,225,255,.4),inset -10px 0 22px -12px rgba(190,160,255,.36),inset 0 0 44px rgba(160,210,255,.1)}
.kb::before{content:"";position:absolute;inset:0;border-radius:38px;pointer-events:none;background:radial-gradient(120% 55% at 18% 0%,rgba(255,255,255,.34),rgba(255,255,255,0) 60%),radial-gradient(60% 40% at 92% 100%,rgba(160,230,255,.22),rgba(255,255,255,0) 70%)}
.kb>*{position:relative}
.sug{display:flex;align-items:center;height:32px;margin-bottom:-2px}
.sg{appearance:none;border:0;background:transparent;flex:1;height:32px;padding:0;font:inherit;font-size:15px;color:#fff;text-shadow:0 1px 2px rgba(0,20,60,.4);cursor:pointer}
.sg:focus-visible,.k:focus-visible{outline:2px solid #bfe9ff;outline-offset:1px}
.dv{width:1px;height:18px;background:rgba(255,255,255,.28)}
#rows{display:flex;flex-direction:column;gap:10px;min-height:152px}
.row{display:flex;gap:6px}
.row.pad{padding:0 4.6%}
.bottom{display:flex;gap:6px}
.k{appearance:none;margin:0;padding:0;flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.34);border-radius:11px;font:inherit;font-size:22px;color:#fff;text-shadow:0 1px 2px rgba(0,20,60,.45);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1) 55%,rgba(255,255,255,.16)),rgba(18,40,92,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.16),inset 3px 0 6px -3px rgba(120,225,255,.45),inset -3px 0 6px -3px rgba(190,160,255,.4),0 2px 5px rgba(6,18,48,.35),0 1px 1px rgba(6,18,48,.3);transition:transform .08s,filter .08s}
.k:active{transform:scale(.94);filter:brightness(1.25)}
.k.s{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04)),rgba(8,22,54,.42);border-color:rgba(255,255,255,.24)}
.k.on{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.22)),rgba(18,40,92,.3);border-color:rgba(255,255,255,.7)}
.k.on svg{fill:#fff}
.k.r{background:linear-gradient(180deg,rgba(150,215,255,.45),rgba(150,215,255,0) 70%),rgba(22,96,210,.88);border-color:rgba(190,230,255,.55);font-size:15px;font-weight:600}
.k.t{font-size:15px;font-weight:500}
.k.e{font-size:24px;text-shadow:none}
.w{flex:1.45}.b1{flex:1.3}.b2{flex:.9}.b3{flex:4.2;letter-spacing:.02em}.b4{flex:2.1}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:152px}
.eg .k{height:auto;min-height:0}
svg{pointer-events:none}
@media(prefers-reduced-motion:reduce){.caret{animation:none}.k{transition:none}.blob{transition:none}}
</style>
</head>
<body>
<div class="screen">
<div class="blob" style="left:-70px;top:30px;width:300px;height:300px;background:var(--b1)"></div>
<div class="blob" style="right:-90px;top:210px;width:300px;height:300px;background:var(--b2)"></div>
<div class="blob" style="left:10px;top:540px;width:260px;height:260px;background:var(--b3)"></div>
<div class="blob" style="right:-10px;top:610px;width:230px;height:230px;background:var(--b4)"></div>
<div class="tag" id="tag">Ocean</div>
<div class="doc" id="doc" role="textbox" aria-multiline="true" aria-readonly="true" aria-label="Typed text" tabindex="0"><span id="txt"></span><i class="caret"></i><span class="ph" id="ph">Start typing…</span></div>
<section class="kb" aria-label="Keyboard">
<div class="sug" id="sug"></div>
<div id="rows"></div>
<div class="bottom" id="bottom"></div>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/"/g,'&quot;');
const S='fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"';
const ICON={
shift:`<svg width="20" height="20" viewBox="0 0 24 24" ${S}><path d="M12 4 4.5 12H9v6h6v-6h4.5z"/></svg>`,
lock:`<svg width="20" height="20" viewBox="0 0 24 24" ${S}><path d="M12 3.5 4.5 11H9v5h6v-5h4.5z"/><path d="M9 19.5h6"/></svg>`,
del:`<svg width="22" height="22" viewBox="0 0 24 24" ${S}><path d="M9 5.5h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-6-6.5z"/><path d="m13 10 4.5 4.5M17.5 10 13 14.5"/></svg>`,
globe:`<svg width="21" height="21" viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5"/><path d="M3.5 12h17"/></svg>`,
emo:`<svg width="21" height="21" viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="8.5"/><path d="M8.3 14c.9 1.5 2.2 2.2 3.7 2.2s2.8-.7 3.7-2.2"/><circle cx="9.2" cy="9.8" r=".6" fill="#fff"/><circle cx="14.8" cy="9.8" r=".6" fill="#fff"/></svg>`
};
const ABC=['qwertyuiop','asdfghjkl','zxcvbnm'];
const NUM=['1234567890','-/:;()$&@"','.,?!\'"'];
const EMOJI=['😀','😂','😍','🥰','😎','🤔','😅','😭','👍','🙏','👏','🔥','✨','💙','🎉','💯','🌊','🌙','⭐','☕','🍕','🚀','🌿'];
const WORDS=['about','after','again','also','and','are','because','but','can','could','dinner','for','from','good','great','have','hello','here','harbour','just','know','later','like','love','meet','morning','need','okay','please','really','see','sharp','soon','sounds','thanks','that','the','then','there','they','think','tonight','want','what','when','where','will','with','would','you','your'];
const THEMES=[['ocean','Ocean'],['dusk','Dusk'],['mint','Mint']];
let text='',shift=1,layer='abc',last=0,ti=0;

const K=(l,k,c='',a='')=>`<button class="k ${c}" data-k="${esc(k)}"${a?` aria-label="${a}"`:''}>${l}</button>`;

function renderKeys(){
  const emo=layer==='emoji',up=shift>0,abc=layer==='abc';
  let h='';
  if(emo){
    h=`<div class="eg">${EMOJI.map(e=>K(e,e,'e')).join('')}${K(ICON.del,'del','s e','Delete')}</div>`;
  }else{
    (abc?ABC:NUM).forEach((r,i)=>{
      const ks=[...r].map(c=>K(abc&&up?c.toUpperCase():c,c)).join('');
      if(i===1&&abc)h+=`<div class="row pad">${ks}</div>`;
      else if(i===2)h+=`<div class="row">${abc?K(shift===2?ICON.lock:ICON.shift,'shift','s w'+(shift?' on':''),'Shift'):''}${ks}${K(ICON.del,'del','s w','Delete')}</div>`;
      else h+=`<div class="row">${ks}</div>`;
    });
  }
  $('#rows').innerHTML=h;
  $('#bottom').innerHTML=K(abc?'123':'ABC','num','s t b1',abc?'Numbers':'Letters')+K(ICON.globe,'globe','s b2','Change background')+K('space','space','t b3','Space')+K(emo?'ABC':ICON.emo,'emo','s b2'+(emo?' t':''),emo?'Letters':'Emoji')+K('return','ret','r b4','Return');
}

function sugs(){
  const m=text.match(/([A-Za-z]+)$/);
  if(m){
    const p=m[1],low=p.toLowerCase(),cap=p[0]!==low[0];
    const r=WORDS.filter(w=>w.startsWith(low)&&w!==low).slice(0,3).map(w=>cap?w[0].toUpperCase()+w.slice(1):w);
    return{list:r.length?r:[p],prefix:p};
  }
  return{list:(!text||/[.!?]\s*$|\n$/.test(text))?['I','The','Hello']:['the','and','you'],prefix:''};
}
let cur={list:[],prefix:''};
function renderSug(){
  cur=sugs();
  $('#sug').innerHTML=cur.list.map(w=>`<button class="sg" data-s="${esc(w)}">${w}</button>`).join('<span class="dv"></span>');
}
function paint(){
  $('#txt').textContent=text;
  $('#ph').hidden=!!text;
  const d=$('#doc');d.scrollTop=d.scrollHeight;
  renderSug();
}
const needCap=()=>layer==='abc'&&(!text||/[.!?]\s$|\n$/.test(text));

function act(k){
  const ps=shift,pl=layer;
  if(k==='shift'){const n=Date.now();shift=(shift===1&&n-last<350)?2:(shift?0:1);last=n;}
  else{
    if(k==='del')text=[...text].slice(0,-1).join('');
    else if(k==='space')text+=' ';
    else if(k==='ret')text+='\n';
    else if(k==='num')layer=layer==='abc'?'num':'abc';
    else if(k==='emo')layer=layer==='emoji'?'abc':'emoji';
    else if(k==='globe'){ti=(ti+1)%THEMES.length;document.documentElement.dataset.theme=THEMES[ti][0];$('#tag').textContent=THEMES[ti][1];}
    else text+=(layer==='abc'&&shift)?k.toUpperCase():k;
    if(shift!==2)shift=needCap()?1:0;
  }
  if(ps!==shift||pl!==layer){
    const f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k;
    renderKeys();
    if(f){const n=document.querySelector(`.kb [data-k="${CSS.escape(f)}"]`);if(n)n.focus();}
  }
  paint();
}

const kb=document.querySelector('.kb');
let hold,rep,held=false;
kb.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s!==undefined){
    text=text.slice(0,text.length-cur.prefix.length)+b.dataset.s+' ';
    if(shift!==2)shift=needCap()?1:0;
    renderKeys();paint();return;
  }
  if(b.dataset.k==='del'&&held){held=false;return;}
  act(b.dataset.k);
});
kb.addEventListener('pointerdown',e=>{
  if(!e.target.closest('[data-k=del]'))return;
  held=false;
  hold=setTimeout(()=>{held=true;rep=setInterval(()=>act('del'),70);},420);
});
const stop=()=>{clearTimeout(hold);clearInterval(rep);};
addEventListener('pointerup',stop);addEventListener('pointercancel',stop);

addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||(e.target.closest&&e.target.closest('button')))return;
  if(e.key==='Backspace')act('del');
  else if(e.key==='Enter')act('ret');
  else if(e.key===' ')act('space');
  else if(e.key.length===1){text+=e.key;if(shift!==2)shift=needCap()?1:0;renderKeys();paint();}
  else return;
  e.preventDefault();
});

renderKeys();paint();
</script>
</body>
</html>
